name: tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  format:
    name: Formatting and script checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18 shellcheck

      - name: Check C and C++ formatting
        run: ci/check-format.sh --check

      - name: Check shell scripts
        run: shellcheck ci/*.sh tests/*.sh

      - name: Check GitHub Actions workflows
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar -xz -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml

      - name: Check Python syntax
        run: python3 -m py_compile src/convert_out.py scripts/compare_oink.py scripts/gen_decomp.py tests/test_gen_decomp.py

  decomp:
    name: Tracked decompositions
    timeout-minutes: 60
    if: >-
      github.event_name != 'push' || github.actor != 'github-actions[bot]' ||
      !contains(github.event.head_commit.message, 'chore: regenerate decompositions [skip ci]')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: decomp-${{ github.ref }}
      cancel-in-progress: true
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y clang-18 ninja-build pipx
          pipx install meson==1.8.5

      - name: Build release tools and check wrapper
        run: |
          meson setup "$TMPDIR/decomp-build" --buildtype=release -Db_ndebug=true -Dlenstree=disabled -Dwerror=true
          meson compile -C "$TMPDIR/decomp-build" pg2adot pg2pmdot
          meson test -C "$TMPDIR/decomp-build" test_gen_decomp --print-errorlogs

      - name: Check tracked decompositions
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: python3 scripts/gen_decomp.py --build-dir "$TMPDIR/decomp-build" --check

      - name: Regenerate on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 scripts/gen_decomp.py --build-dir "$TMPDIR/decomp-build"

      - name: Commit changed decompositions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add -- decomp/ DECOMP.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: regenerate decompositions [skip ci]'
            git push origin HEAD:main
          fi

      - name: Upload decompositions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decomp
          path: |
            decomp/
            DECOMP.md

      - name: Remove scratch build
        if: always()
        run: rm -rf "$TMPDIR/decomp-build"

  oink-oracle:
    name: Live Oink progress-measure oracle
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          printf 'TMPDIR=%s\nOINK_BIN=%s/oink-build/oink\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake ninja-build pipx libboost-filesystem-dev libboost-iostreams-dev libboost-random-dev libboost-regex-dev
          pipx install meson==1.8.5

      - name: Build pinned print-pms Oink
        run: |
          git clone --branch print-pms https://github.com/vfluegel/oink.git "$TMPDIR/oink-src"
          git -C "$TMPDIR/oink-src" checkout --detach 51c2640fe650fd18d9331cfe5133cf3605a98c31
          # Fix only upstream printer defects; see tests/README.md.
          git -C "$TMPDIR/oink-src" apply "$GITHUB_WORKSPACE/scripts/oink-print-pms.patch"
          cmake -S "$TMPDIR/oink-src" -B "$TMPDIR/oink-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DOINK_BUILD_TOOLS=OFF -DOINK_BUILD_TESTS=OFF
          cmake --build "$TMPDIR/oink-build" --target solve --parallel 2

      - name: Compare 500 seeded games per algorithm and quick examples
        run: |
          meson setup "$TMPDIR/strahler-build" --buildtype=debug -Dwerror=true -Dlenstree=disabled
          meson compile -C "$TMPDIR/strahler-build" pg2pmdot
          meson test -C "$TMPDIR/strahler-build" oink-oracle --print-errorlogs

      - name: Upload mismatch reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: oink-oracle-failures
          path: ${{ runner.temp }}/strahler-build/oink-failures
          if-no-files-found: ignore

      - name: Remove scratch builds
        if: always()
        run: rm -rf "$TMPDIR/oink-src" "$TMPDIR/oink-build" "$TMPDIR/strahler-build"

  clang-build-test:
    name: Clang 18 build and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 graphviz libboost-dev ninja-build pipx
          pipx install meson==1.8.5

      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: meson setup build-clang --buildtype=debug -Dwerror=true -Dlenstree=enabled

      - name: Build
        run: meson compile -C build-clang

      - name: Test
        run: meson test -C build-clang --print-errorlogs

  gcc-build-test:
    name: GCC 14 build and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 gcc-14 graphviz libboost-dev ninja-build pipx
          pipx install meson==1.8.5

      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: meson setup build-gcc --buildtype=debug -Dwerror=true -Dlenstree=enabled

      - name: Build
        run: meson compile -C build-gcc

      - name: Test
        run: meson test -C build-gcc --print-errorlogs

  clang-tidy:
    name: Clang-Tidy 18
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-tidy-18 libboost-dev ninja-build pipx
          pipx install meson==1.8.5

      - name: Configure compilation database
        env:
          CC: clang-18
          CXX: clang++-18
        run: meson setup build-tidy --buildtype=debug -Dwerror=true -Dlenstree=enabled

      - name: Build before analysis
        run: meson compile -C build-tidy

      - name: Analyze
        run: ci/check-tidy.sh build-tidy

  coverage-75:
    name: GCC 14 coverage (minimum 75%)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 gcc-14 gcovr graphviz libboost-dev ninja-build pipx
          pipx install meson==1.8.5

      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: meson setup build-coverage --buildtype=debug -Db_coverage=true -Dwerror=true -Dlenstree=enabled

      - name: Build and test
        env:
          GCOV: gcov-14
        run: |
          meson compile -C build-coverage
          meson test -C build-coverage --print-errorlogs

      - name: Generate reports and enforce threshold
        run: |
          gcovr \
            --root . \
            --filter '^src/' \
            --gcov-executable gcov-14 \
            --gcov-object-directory build-coverage \
            --txt build-coverage/coverage.txt \
            --xml-pretty \
            --xml build-coverage/coverage.xml \
            --html-details build-coverage/coverage.html \
            --print-summary \
            --fail-under-line 75

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            build-coverage/coverage.txt
            build-coverage/coverage.xml
            build-coverage/coverage.html
            build-coverage/coverage.*.html

  sanitizers:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 graphviz libboost-dev ninja-build pipx
          pipx install meson==1.8.5

      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: meson setup build-sanitizers --buildtype=debug -Db_sanitize=address,undefined -Db_lundef=false -Dwerror=true -Dlenstree=enabled

      - name: Build
        run: meson compile -C build-sanitizers

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: meson test -C build-sanitizers --print-errorlogs

  valgrind:
    name: Valgrind memory and leak checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 gcc-14 graphviz libboost-dev ninja-build pipx valgrind
          pipx install meson==1.8.5

      - name: Configure and build
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          meson setup build-valgrind --buildtype=debug -Dwerror=true -Dlenstree=enabled
          meson compile -C build-valgrind

      - name: Check memory and leaks
        run: ci/check-valgrind.sh build-valgrind
